#==============================================================================
#                            conkyrc-gauges-demo.conf
#
#  Demo panel showing 6 different gauge styles with CPU metric
#  Column 4 (far left) - for testing gauge styles
#
#==============================================================================

alignment top_left
gap_x 10
gap_y 30
update_interval 3
minimum_size 160 500
maximum_width 160

use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
text_buffer_size 2048

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes

draw_shades no
draw_outline no
draw_borders no

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none

lua_load ~/.config/kodachi/conky/lua/conky-gauges-demo.lua
lua_draw_hook_post main

TEXT
${voffset 480}${goto 5}${font Liberation Sans Narrow:size=8}${color3}GAUGE STYLES DEMO
