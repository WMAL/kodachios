#==============================================================================
#                               conkyrc-logo.conf
#
#  Kodachi Logo/Branding Panel - Just the Kodachi OS branding text
#  NO lua gauges here - they are in the dedicated gauges panel
#==============================================================================

# Position - TOP CENTER of screen (between resources and system)
gap_x 600
gap_y 10
update_interval 60
minimum_size 200 50
maximum_width 220

# General settings
use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2
temperature_unit celsius
no_buffers yes
text_buffer_size 256
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B
color6 FF5C7A

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
stippled_borders 0
border_width 3

default_color B8F7F0
own_window_colour 000000

alignment top_left

override_utf8_locale yes
use_spacer none

TEXT
${goto 5}${font Impact:size=14}${color6}/// ${color1}Linux ${color2}Kodachi
${goto 5}${font Impact:size=11}${color2}Security ${color1}simplified
${goto 5}${font Liberation Sans Narrow:size=9}${color3}v${exec ~/.config/kodachi/conky/scripts/system-meta.sh binary_on}
