#==============================================================================
#                               conkyrc-gauges.conf
#
#  Kodachi Gauges Panel - Cairo lua circular gauges with branding
#  Based on old v8.27 layout - Column 1 (leftmost), TOP position
#==============================================================================

# Position - Column 1 (leftmost of 3 columns), TOP
alignment top_right
gap_x 630
gap_y 30
update_interval 3
minimum_size 230 340
maximum_width 280

# General settings
use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2
temperature_unit celsius
no_buffers yes
text_buffer_size 256
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B
color6 FF5C7A
color7 FFD166

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
stippled_borders 0
border_width 3

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none

# Load Cairo lua gauges
lua_load ~/.config/kodachi/conky/lua/conky-gauges.lua
lua_draw_hook_post main

TEXT
${voffset -6}${goto 38}${font Impact:size=10}${color1}Linux ${color2}Kodachi
${goto 38}${font DejaVu Sans:size=7}${color2}Fortify Your Digital World
${voffset 250}
