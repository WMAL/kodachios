#==============================================================================
#                               conkyrc-security.conf
#
#  Kodachi Privacy Status Panel - Direct exec calls using Rust CLIs
#  Based on old v8.27 layout - Column 2 (middle)
#  Uses cached scripts for performance, prime number intervals for staggering
#  Security hardened: Tor routing for LK Net, masked MAC, consolidated API calls
#==============================================================================

# Position - Column 2 (middle of 3 columns)
alignment top_right
gap_x 300
gap_y 30
update_interval 30
minimum_size 265 0
maximum_width 265

# General settings
use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2
temperature_unit celsius
no_buffers yes
text_buffer_size 2048
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B
color6 FF5C7A
color7 FFD166

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
stippled_borders 0
border_width 3

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none

TEXT
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}PRIVACY STATUS ${execpi 61 ~/.config/kodachi/conky/scripts/snapshot-age.sh}${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Internet: ${execpi 31 ~/.config/kodachi/conky/scripts/internet-status.sh conky}${alignr}${color3}Login: ${if_match "${execi 37 ~/.config/kodachi/conky/scripts/auth-status.sh}" == "On"}${color7}On${else}${color6}Off${endif}
${voffset 7}${goto 5}${font Liberation Sans Narrow:size=10:bold}${color2}ACTIVE ROUTE${alignr}${color1}${execi 17 ~/.config/kodachi/conky/scripts/route-mode.sh mode}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}IP: ${color1}${execi 17 ~/.config/kodachi/conky/scripts/ip-cache.sh ip}${alignr}${color3}Ping: ${color1}${execi 31 ~/.config/kodachi/conky/scripts/random-ping.sh} ms
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Country: ${color1}${execi 17 ~/.config/kodachi/conky/scripts/ip-cache.sh country}${alignr}${color3}City: ${color1}${execi 17 ~/.config/kodachi/conky/scripts/ip-cache.sh city}
${if_match "${execi 37 ~/.config/kodachi/conky/scripts/auth-detail.sh authenticated}" == "Yes"}${voffset 4}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Group: ${color1}${execi 37 ~/.config/kodachi/conky/scripts/auth-detail.sh group}${alignr}${color3}Blocked: ${if_match "${execi 37 ~/.config/kodachi/conky/scripts/auth-detail.sh blocked}" == "On"}${color6}On${else}${color1}Off${endif}
${voffset 2}${goto 5}${font Liberation Sans Narrow:size=10}${color3}SessID: ${color1}${execi 37 ~/.config/kodachi/conky/scripts/auth-detail.sh sessionid}${alignr}${color3}SecID: ${color1}${execi 37 ~/.config/kodachi/conky/scripts/auth-detail.sh secureid}${endif}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}ANONYMITY ${color5}${stippled_hr}${font}
${execpi 37 ~/.config/kodachi/conky/scripts/runtime-detector.sh conky-vpn}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Tor: ${if_match "${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh tor}" == "On"}${color1}On${else}${color6}Off${endif} ${color3}${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh pool}${alignr}${color3}Tor DNS: ${if_match "${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh tordns}" == "On"}${color1}On${else}${color6}Off${endif}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Tor IP: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/tor-exit.sh ip}${alignr}${color3}Country: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/tor-exit.sh country}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Torrified: ${if_match "${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh torrified}" == "On"}${color1}On${else}${color6}Off${endif}${alignr}${color3}Tor Backend: ${color1}${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh backend}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}DNSCrypt: ${if_match "${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh dnscrypt}" == "On"}${color1}On${else}${if_match "${execi 17 ~/.config/kodachi/conky/scripts/tor-status.sh dnscrypt}" == "Up"}${color7}Up${else}${color6}Off${endif}${endif}${alignr}${color3}LK Net: ${if_match "${execi 61 ~/.config/kodachi/conky/scripts/knet-status.sh}" == "On"}${color1}On${else}${color6}Off${endif}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Tor Age: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/process-age.sh tor}${alignr}${color3}VPN Age: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/process-age.sh vpn}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}SECURITY ${color5}${stippled_hr}${font}
${execpi 47 ~/.config/kodachi/conky/scripts/runtime-detector.sh conky-firewall}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}USBGuard: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/security-metrics.sh usbguard}" == "On"}${color1}On${else}${color6}Off${endif}${alignr}${color3}USBKill: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/security-metrics.sh usbkill}" == "On"}${color1}On${else}${color6}Off${endif}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Score: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/security-metrics.sh score}/100${alignr}${color3}Harden: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/security-metrics.sh harden}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}SYSTEM STATUS ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Nuked: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/system-status.sh nuke}" == "Yes"}${color1}Yes${else}${color6}No${endif}${alignr}${color3}AutoLogin: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/system-status.sh autologin}" == "On"}${color6}On${else}${color1}Off${endif}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}DiskEnc: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/system-status.sh diskenc}" == "Yes"}${color1}Yes${else}${color6}No${endif}${alignr}${color3}SwapEnc: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/system-status.sh swapenc}" == "Yes"}${color1}Yes${else}${color6}No${endif}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Swaps: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/system-status.sh swapcount}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}NETWORK ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Active: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/network-status.sh active}${alignr}${color3}Gateway: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/network-status.sh gateway}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}MAC: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/network-status.sh mac}${alignr}${color3}Random: ${execpi 120 ~/.config/kodachi/conky/scripts/network-status.sh macrandom-conky}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Interfaces: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/network-status.sh interfaces}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}DNS ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Mode: ${color1}${execi 61 ~/.config/kodachi/conky/scripts/dns-cache.sh mode}
${execpi 61 ~/.config/kodachi/conky/scripts/dns-block.sh}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}CLOUD STATUS ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Users: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh users}${alignr}${color3}TUsers: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh tusers}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Challenges: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh challenges}${alignr}${color3}Cards: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh cards}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}VPS NODES ${color5}${stippled_hr}${font}
${execpi 120 ~/.config/kodachi/conky/scripts/vps-nodes-block.sh}
${color5}${stippled_hr}${font}
${goto 5}${font Liberation Sans Narrow:size=11:bold}${color3}WEBSITES ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Digi77.com: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh digi77}" == "On"}${color1}On${else}${color6}Off${endif}${alignr}${color3}Kodachi.cloud: ${if_match "${execi 120 ~/.config/kodachi/conky/scripts/cloud-status.sh kodachi_cloud}" == "On"}${color1}On${else}${color6}Off${endif}
