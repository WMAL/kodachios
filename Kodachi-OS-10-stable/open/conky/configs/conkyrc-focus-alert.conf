#==============================================================================
#                           conkyrc-focus-alert.conf
#
#  Kodachi focus alert panel.
#  Top-left high-visibility news+last-changes block + event-driven alert
#  surface, fed by focus-alert.sh. With FOCUS_ALERT_ALWAYS_VISIBLE=1 the
#  panel renders the SIGNAL DECK header + RSS + LAST 5 CHANGES table
#  every tick, so its window footprint is permanent, it MUST NOT
#  intersect the gauges column on the right.
#
# audit 2026-05-24 (f1.png/f2.png field report): previous geometry was
# alignment=top_middle gap_x=0 width=1240, putting the focus-alert window
# at x≈[660,1900] on a 2560-wide screen. The gauges panel at
# x=[1650,1930], y=[30,370] sat under the right end of focus-alert in X11
# z-order; on any stacking change (click, expose event) focus-alert's
# transparent surface visually masked the gauges, leaving only the bottom
# row "PING/BW 1" digit peeking through. Even with own_window_type=override
# the WINDOW still exists and still occludes; the only durable fix is to
# stop the geometries from intersecting at all.
#
# New geometry: anchor to top_left with a narrow column the same width as
# the rendered content (NEWS RSS lines fit in ~700px, LAST 5 CHANGES table
# columns at goto 20/255/430 also fit). 700px starting at gap_x=40 keeps
# focus-alert in x=[40, 740], well clear of the gauges column at x>=1650.
alignment top_left
gap_x 40
gap_y 18
update_interval 1
minimum_size 560 240
maximum_width 560

use_xft yes
xftfont Liberation Sans Narrow:size=10
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2
temperature_unit celsius
no_buffers yes
text_buffer_size 8192
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B
color6 FF5C7A
color7 FFD166

own_window yes
own_window_type normal
own_window_class Conky
own_window_transparent no
own_window_argb_visual yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
draw_graph_borders no
stippled_borders 0
border_width 0

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none

lua_load ~/.config/kodachi/conky/lua/focus-alert-gauge.lua
lua_draw_hook_post focus_alert_gauge

TEXT
${execpi 10 ~/.config/kodachi/conky/scripts/focus-alert.sh render}
