#==============================================================================
#                               conkyrc-resources.conf
#
#  Kodachi Resources Panel - CPU, Memory, Disk usage
#  Based on old v8.27 layout - Column 1 (leftmost), BELOW gauges
#==============================================================================

# Position - Column 1 (leftmost of 3 columns), BELOW gauges
alignment top_right
gap_x 610
gap_y 330
update_interval 15
minimum_size 265 0
maximum_width 265

# General settings
use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2

# ${top cpu N} REPORTS PER-CORE PERCENT, THE SAME NUMBER `top` PRINTS.
#
# Conky's default for this is `no`, which divides each process's usage by the core count and
# reports its share of the whole machine. That made this panel disagree with itself and with
# every other tool on the box: measured 2026-08-05 on a 4-core VM, the header read CPU (4) 40%
# while the three processes under it read 4.59, 2.17 and 1.55, summing to 8. `top` at the same
# moment showed kodachi-soc 15.6, Thunar 12.9 and Xorg 12.6, summing to about 41.
#
# With `yes` the three rows are the same scale as the header above them and as `top`, so the
# panel can be read as "these three are most of that 40%" instead of looking broken.
top_cpu_separate yes
temperature_unit celsius
no_buffers yes
text_buffer_size 256
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
draw_graph_borders no
stippled_borders 0
border_width 3

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none
lua_load ~/.config/kodachi/conky/lua/unit-spacing.lua

TEXT
${voffset 1}
${goto 5}${font Liberation Sans Narrow:size=10:bold}${color2}CPU ${color1}(${exec nproc}) ${font Liberation Sans Narrow:size=10:bold}${color1}${alignr}${cpu}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}1. ${top name 1 24}${alignr}${top cpu 1}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}2. ${top name 2 24}${alignr}${top cpu 2}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}3. ${top name 3 24}${alignr}${top cpu 3}%
${voffset 6}${goto 5}${loadgraph 10,255 666666 666666}
${font Liberation Sans Narrow:size=10}${color5}${stippled_hr}
${goto 5}${font Liberation Sans Narrow:size=10:bold}${color2}MEM ${color1}${memperc}%${alignr}${lua_parse spaced_pair mem memmax}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}1. ${top_mem name 1 24}${alignr}${top_mem mem 1}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}2. ${top_mem name 2 24}${alignr}${top_mem mem 2}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color1}3. ${top_mem name 3 24}${alignr}${top_mem mem 3}%
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Buffers: ${color1}${lua_parse spaced_expr buffers}${alignr}${color3}Cached: ${color1}${lua_parse spaced_expr cached}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Swap: ${color1}${swapperc}%${alignr}${lua_parse spaced_pair swap swapmax}
${color5}${stippled_hr}
${goto 5}${font Liberation Sans Narrow:size=10:bold}${color2}DISKS
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Root: ${color1}${fs_used_perc /}%${alignr}${lua_parse spaced_fs_pair /}
${voffset 4}${goto 5}${fs_bar 6,255 /}
${if_mounted /efi}${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}EFI: ${color1}${fs_used_perc /efi}%${alignr}${lua_parse spaced_fs_pair /efi}${endif}
${if_mounted /efi}${voffset 4}${goto 5}${fs_bar 6,260 /efi}${endif}
${voffset 6}${goto 5}${diskiograph 10,255 666666 666666}
${font Liberation Sans Narrow:size=10}${color5}${stippled_hr}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Freq: ${color1}${freq_g} GHz${alignr}${color3}Load: ${color1}${loadavg 1}
