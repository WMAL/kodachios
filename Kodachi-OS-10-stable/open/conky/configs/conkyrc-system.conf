#==============================================================================
#                               conkyrc-system.conf
#
#  Kodachi System Panel - Traffic, Ports, System info with version check
#  Based on old v8.27 layout - Column 3 (rightmost)
#  Shows local/remote build versions for Binary, Terminal, Desktop
#==============================================================================

# Position - Column 3 (rightmost of 3 columns)
alignment top_right
gap_x 40
gap_y 30
update_interval 20
minimum_size 265 0
maximum_width 265

# General settings
use_xft yes
xftfont DejaVu Sans:size=9
xftalpha 0.95
uppercase no
background yes
cpu_avg_samples 2
net_avg_samples 2
temperature_unit celsius
no_buffers yes
text_buffer_size 2048
color1 A6D96A
color2 6ECFCF
color3 9A989A
color4 FFFFFF
color5 2F6F5B
color6 FF5C7A
color7 FFD166

own_window_transparent no
own_window_type normal
own_window_argb_visual yes
own_window_class Conky
own_window yes
own_window_argb_value 0
own_window_hints undecorated,below,sticky,skip_taskbar,skip_pager
double_buffer yes
total_run_times 0

draw_shades no
draw_outline no
draw_borders no
stippled_borders 0
border_width 3

default_color B8F7F0
own_window_colour 000000

override_utf8_locale yes
use_spacer none

TEXT
${goto 5}${font Liberation Sans Narrow:size=10:bold}${color3}SYSTEM ${color5}${stippled_hr}${font}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Files: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/system-meta.sh files}${alignr}${color3}Threads: ${color1}${threads}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Processes: ${color1}${alignr}${running_processes}/${processes}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Uptime: ${color1}${alignr}${uptime_short}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Timezone: ${color1}${alignr}${execi 600 ~/.config/kodachi/conky/scripts/system-meta.sh timezone}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Host: ${color1}${execi 120 ~/.config/kodachi/conky/scripts/system-meta.sh hostname}${alignr}${color3}NTP: ${execpi 120 ~/.config/kodachi/conky/scripts/system-meta.sh ntp-conky}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Time: ${color1}${time %H:%M}${alignr}${color3}Date: ${color1}${time %d-%m-%Y}
${voffset 6}${goto 5}${font Liberation Sans Narrow:size=10}${color3}Desktop: ${if_match ${desktop}==1}${color1}1${else}${color2}1${endif} ${if_match ${desktop}==2}${color1}2${else}${color2}2${endif} ${if_match ${desktop}==3}${color1}3${else}${color2}3${endif} ${if_match ${desktop}==4}${color1}4${else}${color2}4${endif}
